services:
  ollama:
    image: ollama/ollama
    container_name: asistente-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama
    container_name: asistente-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"

  nucleo:
    build:
      context: ./src/nucleo
    container_name: asistente-nucleo
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:3b
      - WHISPER_MODEL=base
      - PIPER_VOICE=/models/es_MX-claude-high.onnx
    volumes:
      - ./models:/models:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ollama_data: